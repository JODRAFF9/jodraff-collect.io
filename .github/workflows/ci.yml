name: Intégration continue

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  qualite:
    name: Style et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Contrôler le style
        run: ruff check .

      - name: Exécuter les tests
        run: pytest -q --junit-xml=var/tests.xml

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: var/tests.xml
          if-no-files-found: ignore

  chaine-complete:
    name: Chaîne complète jusqu'au PDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Inutile de dérouler la chaîne si le code ne passe déjà pas les tests.
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Ensemble minimal couvrant exactement les paquets du préambule :
      # voir le tableau de correspondance dans reports/README.md.
      - name: Installer LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            texlive-lang-french \
            lmodern

      - name: Créer le jeu de démonstration
        run: python -m scripts.seed_demo --reset

      - name: Exécuter le pipeline medallion
        run: python -m data_platform.runner run

      # Le pipeline signale déjà un contrôle bloquant en échec par son code de
      # sortie ; cette étape rend le détail lisible dans le journal.
      - name: Contrôles qualité de l'entrepôt
        run: python -m data_platform.runner quality

      - name: Produire le rapport LaTeX
        run: python -m reports.generate --survey-code ECVM2026

      - name: Vérifier que le PDF a bien été produit
        run: |
          pdf="var/reports/ECVM2026/rapport_ecvm2026.pdf"
          test -s "$pdf" || { echo "PDF absent ou vide : $pdf"; exit 1; }
          echo "PDF produit : $(du -h "$pdf" | cut -f1)"

      - name: Publier le rapport
        uses: actions/upload-artifact@v4
        with:
          name: rapport-enquete-pdf
          path: |
            var/reports/ECVM2026/rapport_ecvm2026.pdf
            var/reports/ECVM2026/rapport_ecvm2026.tex
          retention-days: 30

      - name: Publier le journal du pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-pipeline
          path: var/pipeline_runs/
          if-no-files-found: ignore

  terraform:
    name: Validation Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Contrôler le formatage
        run: terraform fmt -check -recursive infra/terraform

      # Validation hors ligne : aucun identifiant Azure n'est nécessaire, et
      # aucune ressource n'est créée.
      - name: Initialiser sans dorsale
        run: terraform init -backend=false
        working-directory: infra/terraform

      - name: Valider la configuration
        run: terraform validate
        working-directory: infra/terraform
