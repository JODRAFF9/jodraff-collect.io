[project]
name = "jodraff-collect"
version = "0.1.0"
description = "Plateforme de collecte de donnees : conception, terrain, entrepot medallion, Power Platform, rapports LaTeX"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    # L'extra « email » apporte email-validator, exige par les champs EmailStr
    # des schemas d'enrolement des enqueteurs.
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "duckdb>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "data_platform*", "reports*", "platform_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Les dependances FastAPI s'injectent par valeur par defaut : c'est la
    # signature attendue du framework, pas un piege d'argument mutable.
    "B008",
    # Les enumerations heritent volontairement de (str, Enum) plutot que de
    # StrEnum : ce couple est celui attendu par Pydantic et la serialisation
    # JSON, et le code accede toujours a .value explicitement.
    "UP042",
]
